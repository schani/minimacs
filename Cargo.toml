[package]
name = "minimacs"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "minimacs"

[features]
default = ["clipboard"]
clipboard = ["arboard"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ropey = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
anyhow = "1"
tempfile = "3"
arboard = { version = "3", features = ["wayland-data-control"], optional = true }
tree-sitter-language = "0.1"
tree-house = { version = "=0.4.0", default-features = false }
tree-house-bindings = { version = "=0.3.2", features = ["tree-sitter-language"] }
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-gitcommit = "0.5.0"

[dev-dependencies]
insta = "1"
tempfile = "3"
